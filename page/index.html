<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Entre ou crie sua conta no Chapa Quente.">
  
  <title>Chapa Quente</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Poppins:wght@800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="access">
    <section class="card">
      <h1 class="brand">
        <img src="assets/logo.svg" width="44" height="44" alt="">
        <span>Chapa <strong>Quente</strong></span>
      </h1>

      <div class="tabs" role="tablist">
        <button id="login-tab" class="tab active" type="button" role="tab" data-target="login-panel">Entrar</button>
        <button id="register-tab" class="tab" type="button" role="tab" data-target="register-panel" tabindex="-1">Criar Conta</button>
      </div>

      <form id="login-panel" class="form" role="tabpanel" method="POST" action="../action/logarUsuario.php">
        <div class="field">
          <label for="login-email">E-mail</label>
          <div class="input-wrap">
            <img src="assets/mail.svg" width="18" height="18" alt="">
            <input id="login-email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
          </div>
        </div>
        <div class="field">
          <label for="login-password">Senha</label>
          <div class="input-wrap">
            <img src="assets/lock.svg" width="18" height="18" alt="">
            <input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Digite sua senha" required>
            <button class="show-password" type="button" title="Mostrar senha" data-target="login-password">
              <img src="assets/eye.svg" width="18" height="18" alt="">
            </button>
          </div>
        </div>
        <button class="forgot" type="button">Esqueci minha senha</button>
        <button class="primary" type="submit">Entrar no Chapa Quente</button>
      </form>

      <form id="register-panel" class="form" role="tabpanel"  method="post" action="../action/criarUsuario.php" hidden>
        <div class="field">
          <label for="register-name">Nome completo</label>
          <div class="input-wrap">
            <img src="assets/user.svg" width="18" height="18" alt="">
            <input id="register-name" name="name" type="text" autocomplete="name" placeholder="Seu nome e sobrenome" required>
          </div>
        </div>
        <div class="field">
          <label for="register-email">E-mail</label>
          <div class="input-wrap">
            <img src="assets/mail.svg" width="18" height="18" alt="">
            <input id="register-email" name="email" type="email" autocomplete="email" placeholder="seuemail@exemplo.com" required>
          </div>
        </div>
        <div class="field">
          <label for="register-phone">Telefone (WhatsApp)</label>
          <div class="input-wrap">
            <img src="assets/phone.svg" width="18" height="18" alt="">
            <input id="register-phone" name="phone" type="tel" autocomplete="tel" placeholder="(11) 99999-9999">
          </div>
        </div>
        <div class="field">
          <label for="register-password">Senha</label>
          <div class="input-wrap">
            <img src="assets/lock.svg" width="18" height="18" alt="">
            <input id="register-password" name="password" type="password" autocomplete="new-password" placeholder="Crie uma senha" required>
            <button class="show-password" type="button" title="Mostrar senha" data-target="register-password">
              <img src="assets/eye.svg" width="18" height="18" alt="">
            </button>
          </div>
        </div>
        <button class="primary" type="submit">Finalizar Cadastro</button>
      </form>

      <p id="feedback" class="feedback" role="status" hidden></p>
    </section>
    <footer>
      <!-- Substitua o destino quando a página do cardápio estiver pronta. -->
      <a class="browse" href="#cardapio">Continuar apenas olhando o cardápio <img src="assets/arrow.svg" width="18" height="18" alt=""></a>
    </footer>
  </main>
</body>
</html>
