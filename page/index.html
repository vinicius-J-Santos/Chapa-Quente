<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<link rel="stylesheet" href="style.css">
<body>
    <main>
        <div class="card">
            <form action="../action/criarUsuario.php" method="post">
                <div class="container">
                    <h1 class="title">Criar conta</h1>
                    <div>
                        <label for="nome">Nome</label>
                        <input type="text" name="nome" id="nome" required>
                    </div>
                    <div>
                        <label for="email">Email</label>
                        <input type="email" name="email" id="email" required>
                    </div>
                    <div>
                        <label for="tel">Telefone</label>
                        <input type="tel" name="tel" id="tel">
                    </div>
                    <div>
                        <label for="senha">Senha</label>
                        <input type="password" name="senha" id="senha" required>
                    </div>
                    <div class="button">
                        <input type="submit" value="Criar">
                        <input type="reset" value="Limpar">
                    </div>
                </div>        
            </form>
            <form action="../action/logarUsuario.php" method="post">
                <div class="container">
                    <h1 class="title">Acessar conta</h1>
                    <div>
                        <label for="email2">Email</label>
                        <input type="email" name="email" id="email2" required>
                    </div>
                    <div>
                        <label for="senha2">Senha</label>
                        <input type="password" name="senha" id="senha2" required>
                    </div>
                    <div class="button">
                        <input type="submit" value="Criar">
                        <input type="reset" value="Limpar">
                    </div>
                </div>        
            </form>
        </div>
    </main>
</body>
</html>
